<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETR.JS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <!-- 왼쪽: HOLD + 통계 + 액션 텍스트 -->
    <section class="side left">
      <div class="panel">
        <div class="label">HOLD</div>
        <canvas id="hold" width="120" height="90"></canvas>
      </div>

      <div id="actions" class="actions"></div>

      <div class="stats">
        <div class="stat"><span class="stat-label">SCORE</span><span id="score" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">LINES</span><span id="lines" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">LEVEL</span><span id="level" class="stat-value">1</span></div>
        <div class="stat"><span class="stat-label">PIECES</span><span id="pieces" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">PPS</span><span id="pps" class="stat-value">0.00</span></div>
        <div class="stat"><span class="stat-label">TIME</span><span id="time" class="stat-value">0:00.00</span></div>
      </div>
    </section>

    <!-- 가운데: 메인 보드 -->
    <section class="board-wrap">
      <canvas id="board" width="300" height="660"></canvas>
      <div id="frame" class="board-frame"></div>
      <div id="overlay" class="overlay">
        <h1 class="logo">TETR<span>.JS</span></h1>
        <p id="overlay-msg" class="overlay-msg"></p>
        <button id="start-btn" class="btn">START</button>
        <button type="button" class="btn btn-sub" data-open-settings>SETTINGS</button>
      </div>
    </section>

    <!-- 오른쪽: NEXT + 조작키 -->
    <section class="side right">
      <div class="panel">
        <div class="label">NEXT</div>
        <canvas id="next" width="120" height="380"></canvas>
      </div>

      <button type="button" class="side-btn" data-open-settings>⚙ 키 / 핸들링 설정</button>
      <!-- settings.js가 현재 키 설정으로 채움 -->
      <table id="controls" class="controls"></table>
    </section>
  </main>

  <script src="settings.js"></script>
  <script src="game.js"></script>
</body>
</html>
